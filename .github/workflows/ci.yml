name: ci
on:
  # Both branches: `extract` is the default branch until the initial history is
  # fast-forwarded onto main, and the README badge tracks the default branch.
  push:
    branches: [main, extract]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      # No magic-nix-cache: it now requires a FlakeHub account and fails to
      # authenticate on a plain public repo, adding a red annotation for a
      # build this small does not need.
      - name: shellcheck
        run: nix develop -c shellcheck adapters/core/*.sh scripts/*.sh
      - name: adapters are in sync
        run: |
          nix develop -c ./scripts/gen-adapters.sh
          git diff --exit-code
      # module.bats runs real `nix build`/`nix eval` against this flake,
      # including one `nix build` of 8 outputs at once and fresh <nixpkgs>
      # resolution. On a cold cache -- true on every fresh runner -- that
      # races internally on the git-fetcher cache, independent of bats-level
      # concurrency: it fails the same way run alone as run in parallel with
      # itself, and only stops once the cache is warm. Run it alone, first,
      # so the cache is warm before the parallel step below touches the
      # flake again -- bats-level serialization (--no-parallelize-within-files)
      # would not help, since the race isn't between bats tests.
      - name: bats (module.bats, serial)
        run: nix develop -c bats tests/module.bats
      # bats --jobs requires GNU parallel on PATH inside the devshell, so
      # check for it explicitly with a legible error rather than letting a
      # missing binary surface as an opaque bats failure. No TAP/count-parsing
      # guard is added here: bats' own bats_test_count_validator (in
      # libexec/bats-core/bats, wired with `set -o pipefail execfail`) already
      # fails the whole run, aggregated across every file, on any test-count
      # shortfall. module.bats is excluded here -- it already ran above.
      #
      # --jobs 16 (#126): the runner measured at nproc=4; the suite is
      # subprocess-bound, not CPU-bound, so above-core parallelism keeps
      # paying off. Measured on this runner (module.bats excluded, N=581):
      #   --jobs  4 (1x): 2m50s
      #   --jobs  8 (2x): 1m55s
      #   --jobs 16 (4x): 1m24s  <- chosen
      #   --jobs 32 (8x): 1m21s, but reproduced a real flake twice
      #                   (stall-watch: one post per episode...) under that
      #                   much oversubscription -- ~3% faster than 16 isn't
      #                   worth it.
      - name: bats
        shell: bash
        run: |
          if ! nix develop -c bash -c 'command -v parallel' >/dev/null; then
            echo "::error::GNU parallel not found in the nix devshell (required for bats --jobs)"
            exit 1
          fi
          nix develop -c bash -c '
            files=$(find tests -maxdepth 1 -name "*.bats" ! -name "module.bats" | sort)
            bats --jobs 16 $files
          '
      - name: flake check
        run: nix flake check
