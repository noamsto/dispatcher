name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: shellcheck
        run: nix develop -c shellcheck adapters/core/*.sh adapters/core/reviewers/*.sh scripts/*.sh
      - name: adapters are in sync
        run: |
          nix develop -c ./scripts/gen-adapters.sh
          git diff --exit-code

  bats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      # module.bats warms this runner's git-fetcher cache before the parallel
      # shard touches the flake. Matrix runners do not share that cache.
      - name: bats (module.bats, serial)
        run: nix develop -c bats tests/module.bats
      - name: bats (shard ${{ matrix.shard }})
        shell: bash
        run: |
          if ! nix develop -c bash -c 'command -v parallel' >/dev/null; then
            echo "::error::GNU parallel not found in the nix devshell (required for bats --jobs)"
            exit 1
          fi
          nix develop -c bash -c 'bats --jobs 16 --filter-tags "!timing" $(./scripts/bats-shard.sh ${{ matrix.shard }} 4)'

  bats-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: bats (secret-read-guard timing, serial)
        run: nix develop -c bats --filter-tags timing tests/secret-read-guard.bats

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: flake check
        run: nix flake check

  check:
    if: always()
    needs: [lint, bats, bats-timing, flake-check]
    runs-on: ubuntu-latest
    steps:
      - name: report failed dependencies
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
