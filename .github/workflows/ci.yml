name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: shellcheck
        run: nix develop -c shellcheck adapters/core/*.sh adapters/core/reviewers/*.sh scripts/*.sh
      - name: adapters are in sync
        run: |
          nix develop -c ./scripts/gen-adapters.sh
          git diff --exit-code
      # Proves every !timing case is covered by exactly one shard unit. Stale
      # or missing weights warn and fall back (never drop a family) — regenerate
      # with scripts/bats-shard-weights.sh.
      - name: shard plan covers the suite
        run: nix develop -c bash scripts/bats-shard.sh --check

  # module.bats's setup_file does a multi-output nix build of this flake.
  # On a cold git-fetcher cache that races inside nix, so this file runs
  # alone, once, on this runner. Shard jobs still `nix develop`; their
  # bats files do not run this build, and runners do not share a store.
  bats-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: bats (module.bats, serial)
        run: nix develop -c bats tests/module.bats

  bats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: bats (shard ${{ matrix.shard }})
        shell: bash
        env:
          BATS_SHARD: ${{ matrix.shard }}
        run: |
          nix develop -c bash -euo pipefail <<'SHARD'
            set -euo pipefail
            if ! command -v parallel >/dev/null; then
              echo "::error::GNU parallel not found in the nix devshell (required for bats --jobs)"
              exit 1
            fi
            shopt -s lastpipe
            ./scripts/bats-shard.sh "$BATS_SHARD" 4 | mapfile -t units
            fail=0
            whole=()
            filtered_files=()
            filtered_regexes=()
            for unit in "${units[@]+"${units[@]}"}"; do
              [[ -n $unit ]] || continue
              if [[ $unit == *$'\t'* ]]; then
                filtered_files+=("${unit%%$'\t'*}")
                filtered_regexes+=("${unit#*$'\t'}")
              else
                whole+=("$unit")
              fi
            done
            if ((${#whole[@]} > 0)); then
              bats --jobs 16 --filter-tags '!timing' "${whole[@]}" || fail=1
            fi
            if ((${#filtered_files[@]} > 0)); then
              for i in "${!filtered_files[@]}"; do
                bats --jobs 16 --filter-tags '!timing' --filter "${filtered_regexes[$i]}" \
                  "${filtered_files[$i]}" || fail=1
              done
            fi
            exit "$fail"
          SHARD

  bats-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: bats (secret-read-guard timing, serial)
        run: nix develop -c bats --filter-tags timing tests/secret-read-guard.bats

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: flake check
        run: nix flake check

  check:
    if: always()
    needs: [lint, bats, bats-module, bats-timing, flake-check]
    runs-on: ubuntu-latest
    steps:
      - name: report failed dependencies
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
