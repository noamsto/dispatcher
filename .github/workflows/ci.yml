name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: lazytmux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: shellcheck
        run: nix develop -c shellcheck adapters/core/*.sh adapters/core/reviewers/*.sh scripts/*.sh
      - name: go vet + golangci-lint (crew)
        run: nix develop -c sh -c 'cd crew && go vet ./... && golangci-lint run ./...'
      - name: adapters are in sync
        run: |
          nix develop -c ./scripts/gen-adapters.sh
          git diff --exit-code
      # Proves every !timing case is covered by exactly one shard unit. Stale
      # or missing weights warn and fall back (never drop a family) — regenerate
      # with scripts/bats-shard-weights.sh.
      - name: shard plan covers the suite
        run: nix develop -c bash scripts/bats-shard.sh --check

  # module.bats's setup_file does a multi-output nix build of this flake.
  # On a cold git-fetcher cache that races inside nix, so this file runs
  # alone, once, on this runner. Shard jobs still `nix develop`; their
  # bats files do not run this build, and runners do not share a store.
  bats-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: lazytmux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: bats (module.bats, serial)
        run: nix develop -c bats tests/module.bats

  bats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: lazytmux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: bats (shard ${{ matrix.shard }})
        shell: bash
        env:
          BATS_SHARD: ${{ matrix.shard }}
        run: |
          nix develop -c bash -euo pipefail <<'SHARD'
            set -euo pipefail
            junit_dir="$RUNNER_TEMP/bats-junit-$BATS_SHARD"
            mkdir -p "$junit_dir"
            if ! command -v parallel >/dev/null; then
              echo "::error::GNU parallel not found in the nix devshell (required for bats --jobs)"
              exit 1
            fi
            shopt -s lastpipe
            ./scripts/bats-shard.sh "$BATS_SHARD" 4 | mapfile -t units
            fail=0
            whole=()
            filtered_files=()
            filtered_regexes=()
            for unit in "${units[@]+"${units[@]}"}"; do
              [[ -n $unit ]] || continue
              if [[ $unit == *$'\t'* ]]; then
                filtered_files+=("${unit%%$'\t'*}")
                filtered_regexes+=("${unit#*$'\t'}")
              else
                whole+=("$unit")
              fi
            done
            # Units run at once so the heaviest is the only critical path; logs go
            # to per-run files because concurrent TAP streams interleave.
            jobs=4
            whole_jobs=12
            pids=()
            logs=()
            if ((${#whole[@]} > 0)); then
              mkdir -p "$junit_dir/whole"
              bats --jobs "$whole_jobs" --filter-tags '!timing' --report-formatter junit \
                --output "$junit_dir/whole" "${whole[@]}" >"$junit_dir/whole.log" 2>&1 &
              pids+=("$!")
              logs+=("$junit_dir/whole.log")
            fi
            for i in "${!filtered_files[@]}"; do
              mkdir -p "$junit_dir/filter-$i"
              bats --jobs "$jobs" --filter-tags '!timing' --filter "${filtered_regexes[$i]}" \
                --report-formatter junit --output "$junit_dir/filter-$i" \
                "${filtered_files[$i]}" >"$junit_dir/filter-$i.log" 2>&1 &
              pids+=("$!")
              logs+=("$junit_dir/filter-$i.log")
            done
            for i in "${!pids[@]}"; do
              wait "${pids[$i]}" || fail=1
              echo "::group::${logs[$i]##*/}"
              cat "${logs[$i]}"
              echo "::endgroup::"
            done
            exit "$fail"
          SHARD
      - name: upload bats timings (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: bats-timing-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bats-junit-${{ matrix.shard }}
          if-no-files-found: error

  bats-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: lazytmux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: bats (secret-read-guard timing, serial)
        run: nix develop -c bats --filter-tags timing tests/secret-read-guard.bats

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: lazytmux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: flake check
        run: nix flake check
      - name: build packages for the cache
        run: nix build .#default --no-link

  check:
    if: always()
    needs: [lint, bats, bats-module, bats-timing, flake-check]
    runs-on: ubuntu-latest
    steps:
      - name: report failed dependencies
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
