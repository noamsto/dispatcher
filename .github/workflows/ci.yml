name: ci
on:
  # Both branches: `extract` is the default branch until the initial history is
  # fast-forwarded onto main, and the README badge tracks the default branch.
  push:
    branches: [main, extract]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      # No magic-nix-cache: it now requires a FlakeHub account and fails to
      # authenticate on a plain public repo, adding a red annotation for a
      # build this small does not need.
      - name: shellcheck
        run: nix develop -c shellcheck adapters/core/*.sh scripts/*.sh
      - name: adapters are in sync
        run: |
          nix develop -c ./scripts/gen-adapters.sh
          git diff --exit-code
      - name: bats
        run: nix develop -c bats tests/
      - name: flake check
        run: nix flake check
