name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: shellcheck
        run: nix develop -c shellcheck adapters/core/*.sh adapters/core/reviewers/*.sh scripts/*.sh
      - name: adapters are in sync
        run: |
          nix develop -c ./scripts/gen-adapters.sh
          git diff --exit-code

  # module.bats's setup_file does a multi-output nix build and a fresh
  # <nixpkgs> import. That races inside nix on a cold git-fetcher cache,
  # so this file runs alone, once, on this runner. Shard jobs still
  # `nix develop`; their bats files do not run this build, and runners do
  # not share a store.
  bats-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: bats (module.bats, serial)
        run: nix develop -c bats tests/module.bats

  bats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: bats (shard ${{ matrix.shard }})
        shell: bash
        run: |
          if ! nix develop -c bash -c 'command -v parallel' >/dev/null; then
            echo "::error::GNU parallel not found in the nix devshell (required for bats --jobs)"
            exit 1
          fi
          nix develop -c bash -c 'bats --jobs 16 --filter-tags "!timing" $(./scripts/bats-shard.sh ${{ matrix.shard }} 4)'

  bats-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: bats (secret-read-guard timing, serial)
        run: nix develop -c bats --filter-tags timing tests/secret-read-guard.bats

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: flake check
        run: nix flake check

  check:
    if: always()
    needs: [lint, bats, bats-module, bats-timing, flake-check]
    runs-on: ubuntu-latest
    steps:
      - name: report failed dependencies
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  harness-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HARNESS_BENCH_CPU_SET: 0-3
      HARNESS_BENCH_REPETITIONS: 5
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - name: verify manifest and four-core affinity
        run: |
          nix develop -c bash scripts/harness-manifest.sh --check
          nix develop -c bash -euo pipefail <<'BENCH_CHECK'
            set -euo pipefail
            allowed=$(taskset -c "$HARNESS_BENCH_CPU_SET" awk '$1 == "Cpus_allowed_list:" { print $2 }' /proc/self/status)
            [[ $allowed == "$HARNESS_BENCH_CPU_SET" ]] || {
              echo "::error::expected four-core affinity $HARNESS_BENCH_CPU_SET, got $allowed"
              exit 1
            }
            [[ $(taskset -c "$HARNESS_BENCH_CPU_SET" nproc) == 4 ]] || {
              echo "::error::CPU set $HARNESS_BENCH_CPU_SET does not expose exactly four cores"
              exit 1
            }
          BENCH_CHECK
      - name: benchmark Bats compatibility
        run: |
          nix develop -c bash scripts/harness-bench.sh \
            --harness bats \
            --mode compatibility \
            --adapter tests/harness/bats/compatibility.sh \
            --repetitions "$HARNESS_BENCH_REPETITIONS" \
            --cpu-set "$HARNESS_BENCH_CPU_SET" \
            --output harness-bench/bats-compatibility
      - name: benchmark Bats tuned
        run: |
          nix develop -c bash scripts/harness-bench.sh \
            --harness bats \
            --mode tuned \
            --adapter tests/harness/bats/tuned.sh \
            --repetitions "$HARNESS_BENCH_REPETITIONS" \
            --cpu-set "$HARNESS_BENCH_CPU_SET" \
            --output harness-bench/bats-tuned
      - name: benchmark ShellSpec
        run: |
          nix-shell tests/harness/shellspec/shell.nix --run "
            bash scripts/harness-bench.sh \
              --harness shellspec \
              --mode prototype \
              --adapter tests/harness/shellspec/adapter.sh \
              --repetitions $HARNESS_BENCH_REPETITIONS \
              --cpu-set $HARNESS_BENCH_CPU_SET \
              --output harness-bench/shellspec
          "
      - name: benchmark Go
        run: |
          nix develop -c bash scripts/harness-bench.sh \
            --harness go \
            --mode prototype \
            --adapter tests/harness/go/adapter.sh \
            --repetitions "$HARNESS_BENCH_REPETITIONS" \
            --cpu-set "$HARNESS_BENCH_CPU_SET" \
            --output harness-bench/go
      - name: benchmark pytest
        run: |
          nix-shell tests/harness/pytest/shell.nix --run "
            bash scripts/harness-bench.sh \
              --harness pytest \
              --mode prototype \
              --adapter tests/harness/pytest/adapter.sh \
              --repetitions $HARNESS_BENCH_REPETITIONS \
              --cpu-set $HARNESS_BENCH_CPU_SET \
              --output harness-bench/pytest
          "
      - name: assemble benchmark evidence
        if: always()
        run: |
          nix develop -c bash -euo pipefail <<'BENCH_EVIDENCE'
            set -euo pipefail
            mkdir -p harness-bench
            revision=$(git rev-parse HEAD)
            printf "run_id\trevision\tharness\tmode\trep\tcase_id\tstatus\twall_ms\tcpu_user_ms\tcpu_sys_ms\n" \
              >harness-bench/evidence.tsv
            while IFS= read -r results; do
              awk -F "\t" -v OFS="\t" -v run_id="$GITHUB_RUN_ID" -v revision="$revision" \
                'NR > 1 { print run_id, revision, $1, $2, $3, $4, $7, $8, $9, $10 }' \
                "$results" >>harness-bench/evidence.tsv
            done < <(find harness-bench -mindepth 2 -name results.tsv -print | sort)
          BENCH_EVIDENCE
      - name: upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-bench-${{ github.run_id }}-${{ github.sha }}
          path: harness-bench/
          if-no-files-found: error
